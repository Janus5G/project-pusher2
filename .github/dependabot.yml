version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Copenhagen"
    open-pull-requests-limit: 5
    assignees:
      - Janus5G
    commit-message:
      prefix: "chore(deps)"
      include: scope
    ignore:
      - dependency-name: electron
        update-types:
          - "version-update:semver-major"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Copenhagen"
    open-pull-requests-limit: 5
    assignees:
      - Janus5G
    commit-message:
      prefix: "chore(ci)"
