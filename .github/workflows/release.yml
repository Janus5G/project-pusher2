name: Build Cross-Platform Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: JavaScript syntax check
        run: npm run check:js

      - name: Run tests
        run: npm test

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          echo "package.json version: $PACKAGE_VERSION"
          echo "Git tag version:       $TAG_VERSION"

          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: Git tag does not match package.json version."
            exit 1
          fi

  build:
    name: Build ${{ matrix.name }}
    needs: validate

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            command: npm run build:win
            artifact: project-pusher-windows
            files: |
              dist/*.exe

          - name: Linux x64
            os: ubuntu-latest
            command: npm run build:linux
            artifact: project-pusher-linux
            files: |
              dist/*.AppImage

          - name: macOS Universal
            os: macos-latest
            command: npm run build:mac
            artifact: project-pusher-macos
            files: |
              dist/*.dmg
              dist/*.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: ${{ matrix.command }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build

    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all platform builds
        uses: actions/download-artifact@v8
        with:
          pattern: project-pusher-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: python
        run: |
          from pathlib import Path
          import hashlib

          root = Path("release-assets")
          output = root / "SHA256SUMS.txt"

          files = sorted(
              p for p in root.iterdir()
              if p.is_file() and p.name != "SHA256SUMS.txt"
          )

          if not files:
              raise SystemExit("No release files found.")

          lines = []

          for path in files:
              digest = hashlib.sha256()

              with path.open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      digest.update(chunk)

              lines.append(f"{digest.hexdigest()}  {path.name}")

          output.write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8"
          )

          print(output.read_text())

      - name: Prepare checksum release notes
        shell: bash
        run: |
          {
            echo "## SHA-256 checksums"
            echo
            echo '```text'
            cat release-assets/SHA256SUMS.txt
            echo '```'
          } > release-prefix.md

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release-assets/* \
            --verify-tag \
            --generate-notes \
            --notes "$(cat release-prefix.md)"
