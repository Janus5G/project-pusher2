name: RepoDoc

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "main/**"
      - "renderer/**"
      - "repodoc.py"
      - ".github/workflows/repodoc.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: repodoc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-readme:
    name: Update repository summary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Generate documentation summary
        run: python repodoc.py . --output repodoc-summary.json

      - name: Create Pull Request for documentation
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "docs: auto-update repository summary"
          title: "docs: auto-update repository summary"
          body: "Automated update from RepoDoc pipeline."
          branch: "docs/auto-update-summary"
          delete-branch: true
          add-paths: |
            repodoc-summary.json
