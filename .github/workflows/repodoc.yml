name: RepoDoc

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "main/**"
      - "renderer/**"
      - "repodoc.py"
      - ".github/workflows/repodoc.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repodoc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-summary:
    name: Update repository summary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Generate repository summary
        run: python repodoc.py . --output repodoc-summary.json

      - name: Commit summary when changed
        shell: bash
        run: |
          if git diff --quiet -- repodoc-summary.json; then
            echo "RepoDoc summary is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repodoc-summary.json
          git commit -m "docs: auto-update repository summary"
          git push
