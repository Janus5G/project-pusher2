name: RepoDoc

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "main/**"
      - "renderer/**"
      - "repodoc.py"
      - ".github/workflows/repodoc.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repodoc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-readme:
    name: Update README
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Opsætter Python i stedet for Node.js for at køre dit script
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Kalder dit Python-script og genererer JSON-rapporten direkte i din README-mappe
      - name: Generate documentation summary
        run: python repodoc.py . --output repodoc-summary.json

      - name: Create Pull Request for Documentation
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "docs: auto-update README"
          title: "docs: auto-update repository summary"
          body: "Automated update from RepoDoc pipeline."
          branch: "docs/auto-update-summary"

